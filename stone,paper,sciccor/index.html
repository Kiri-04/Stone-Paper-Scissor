<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper scissors game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Rock Paper Scissors</h1>
    <div class="choices">
        <div class="choice">
            <img src="paper.png" id="paper" alt="ERROR$$$$">
        </div>
        <div class="choice">
            <img src="scissors.png" id="scissors" alt="ERROR">
        </div>
        <div class="choice">
            <img src="rock.png" id="rock" alt="ERROR$$$$">
        </div>
    </div>
    <div class="scoreboard">
        <div class="score">
            <p id="userscore">0</p>
            <p>YOU</p>
        </div>
        <div class="score">
            <p id="compscore">0</p>
            <p>COMP</p>
        </div>
    </div>
    <div class="msg-container">
        <p id="msg">YOUR MOVE</p>
    </div>
    <script src="app.js"></script>
</body>

</html>
